<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cenflix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: makieta Cenflix — wąska kolumna 1280px, panel preferencji po lewej, wynik + plan + oferty po prawej */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#14161B; --muted:#5B6170; --line:#E2E4E9; --line2:#D6D9E0;
  --accent:#2446D8; --accent-ink:#1A33A3; --accent-soft:#E8EDFD; --on-accent:#FFFFFF;
  --hero:#14161B; --hero-ink:#FFFFFF; --hero-muted:#C9CEDA; --hero-line:#2E3445; --hero-line2:#4A5163;
  --ok:#1E6B3D; --ok-soft:#E5F3EA; --warn:#6E4E00; --warn-line:#8A6100; --warn-soft:#FFF4D6;
  --alert:#B4470A; --alert-ink:#6B2A05; --alert-soft:#FFF1E6; --alert-btn:#8A3507;
  --poster1:#1E2433; --poster2:#2E3445; --poster3:#3A4256; --poster4:#474F64; --poster5:#565E73; --poster-ink:#C9CEDA;
  --shadow:0 16px 32px rgba(20,22,27,.08);
  --f-display:'Space Grotesk', 'Inter', system-ui, sans-serif;
  --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gutter:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#181B22; --ink:#ECEEF2; --muted:#9AA1B0; --line:#262B35; --line2:#343A47;
  --accent:#7189FF; --accent-ink:#AFBEFF; --accent-soft:#1C2550; --on-accent:#0F1115;
  --hero:#1F2431; --hero-ink:#FFFFFF; --hero-muted:#B9BFCC; --hero-line:#323949; --hero-line2:#4A5163;
  --ok:#7DD3A0; --ok-soft:#163024; --warn:#E9C46A; --warn-line:#B48A2A; --warn-soft:#352B10;
  --alert:#F29A62; --alert-ink:#F7C6A6; --alert-soft:#3A2312; --alert-btn:#F7C6A6;
  --poster1:#232A3B; --poster2:#2B3244; --poster3:#363E52; --poster4:#414A60; --poster5:#4D566D; --poster-ink:#C9CEDA;
  --shadow:0 16px 32px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#181B22; --ink:#ECEEF2; --muted:#9AA1B0; --line:#262B35; --line2:#343A47;
  --accent:#7189FF; --accent-ink:#AFBEFF; --accent-soft:#1C2550; --on-accent:#0F1115;
  --hero:#1F2431; --hero-ink:#FFFFFF; --hero-muted:#B9BFCC; --hero-line:#323949; --hero-line2:#4A5163;
  --ok:#7DD3A0; --ok-soft:#163024; --warn:#E9C46A; --warn-line:#B48A2A; --warn-soft:#352B10;
  --alert:#F29A62; --alert-ink:#F7C6A6; --alert-soft:#3A2312; --alert-btn:#F7C6A6;
  --poster1:#232A3B; --poster2:#2B3244; --poster3:#363E52; --poster4:#414A60; --poster5:#4D566D; --poster-ink:#C9CEDA;
  --shadow:0 16px 32px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
a{color:var(--accent)} a:hover{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(var(--gutter), env(safe-area-inset-left,0px));padding-right:max(var(--gutter), env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.5px;color:var(--ink);text-decoration:none}
.logo span{color:var(--accent)}
.nav{display:flex;align-items:center;gap:20px;font-size:14px;font-weight:500}
.nav a{text-decoration:none;color:var(--ink)}
.pill-reg{padding:6px 10px;border:1px solid var(--line2);border-radius:999px;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}

/* ---------- Search ---------- */
.search{position:relative;text-align:left}
.search-box{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:0 18px;min-height:64px}
.search.open .search-box{border-radius:16px 16px 0 0}
.search-box input{flex:1;border:0;outline:none;font-size:18px;background:transparent;min-width:0}
.search-box svg{stroke:var(--accent);flex:none}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:2px solid var(--accent);border-top:1px solid var(--line);border-radius:0 0 16px 16px;overflow:hidden;box-shadow:var(--shadow)}
.sugg a{display:flex;align-items:center;gap:14px;padding:12px 18px;text-decoration:none;color:var(--ink);min-height:56px}
.sugg a[aria-selected="true"]{background:var(--accent-soft)}
.sugg .mini{width:36px;height:50px;border-radius:6px;flex:none}
.sugg .t{display:flex;flex-direction:column;flex:1;min-width:0}
.sugg .t span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .p{font-size:13px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.sugg .empty{padding:16px 18px;color:var(--muted);font-size:14px}
.search.compact .search-box{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:0 14px;min-height:46px;gap:10px}
.search.compact.open .search-box{border-radius:12px 12px 0 0}
.search.compact .search-box input{font-size:15px}
.search.compact .search-box svg{stroke:var(--muted)}
.search.compact .sugg{border:1px solid var(--line2);border-radius:0 0 12px 12px}

/* ---------- Home ---------- */
.home-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-block:18px}
.home-main{padding-block:48px 64px;display:flex;flex-direction:column;gap:56px}
.hero-home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}
.hero-home h1{margin:0;max-width:820px;font-family:var(--f-display);font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-1.5px}
.hero-home p.lead{margin:0;max-width:620px;font-size:18px;color:var(--muted)}
.hero-home .search{width:100%;max-width:680px}
.try{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:13px;color:var(--muted);align-items:center}
.try button{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;min-height:36px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px}
.step b.n{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--accent)}
.step strong{font-size:17px}
.step span{color:var(--muted)}
.cat-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.cat-head h2{margin:0;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{min-height:34px;padding:5px 12px;font-size:13px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.scard{text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s, transform .15s}
.scard:hover{border-color:var(--accent);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.scard:hover{transform:translateY(-2px)}}
.poster{height:150px;color:var(--poster-ink);font-size:12px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.poster .ini{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:-1px;opacity:.55}
.poster .svcs{display:flex;gap:4px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:700;font-size:11px;font-family:var(--f-display)}
.scard .body{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.scard .meta{font-size:13px;color:var(--muted)}
.scard .price{font-size:14px;font-weight:600;color:var(--accent-ink);margin-top:auto}
.more{align-self:center;padding:10px 18px;min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:600}
.method{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:17px}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.panel ul b{color:var(--ink);font-weight:600}
.tbl-wrap{overflow-x:auto}
table.plans{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
table.plans th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.plans td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.plans td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.plans tr:last-child td{border-bottom:0}

/* ---------- Series page ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{padding-block:14px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px}
.topbar .search{flex:1 1 320px}
.s-main{padding-block:28px 48px;display:flex;flex-direction:column;gap:24px}
.s-head{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.s-head .poster{width:112px;height:160px;border-radius:12px;flex:none}
.s-head .info{flex:1 1 400px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.tag{padding:4px 10px;background:var(--surface);border:1px solid var(--line2);border-radius:999px}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.tag.unk{border:1px dashed var(--warn-line);color:var(--warn);background:transparent}
.s-head h1{margin:0;font-family:var(--f-display);font-size:clamp(30px,5vw,40px);line-height:1.1;letter-spacing:-.8px}
.s-head p{margin:0;color:var(--muted)}
.layout{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.prefs{flex:1 1 280px;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:22px}
.prefs-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prefs-h h2{margin:0;font-size:17px;white-space:nowrap}
.link-btn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;min-height:44px;padding:0 4px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;padding:0}
.prof-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prof{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;min-height:56px;background:var(--surface);border:1px solid var(--line2)}
.prof[aria-pressed="true"]{background:var(--accent-soft);border:1.5px solid var(--accent)}
.prof .n{font-weight:600;font-size:14px}.prof .d{font-size:12px;color:var(--muted)}
.prof.wide{grid-column:1 / -1}
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-size:14px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:18px}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper output{min-width:32px;text-align:center;font-weight:700;font-family:var(--f-display);font-size:18px}
.field{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;min-height:44px}
.field input,.field select{border:0;background:transparent;font-weight:600;min-height:40px;text-align:right;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;border:0;cursor:pointer;font-size:14px;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.check{display:flex;align-items:center;gap:10px;font-size:14px;min-height:40px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.check .dot{width:20px;height:20px;font-size:10px}
.hint{font-size:12px;color:var(--muted);margin:0}
.results{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:18px}
.hero .badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.hero .b1{padding:4px 10px;border-radius:999px;background:#2446D8;color:#fff;font-weight:600}
.hero .b2{padding:4px 10px;border-radius:999px;border:1px solid var(--hero-line2);color:var(--hero-muted)}
.hero .crit{color:var(--hero-muted)}
.hero .row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.hero .big{font-family:var(--f-display);font-size:clamp(44px,8vw,64px);font-weight:700;line-height:1;letter-spacing:-1.5px}
.hero .sub{font-size:15px;color:var(--hero-muted)}
.hero .pl{font-size:18px;font-weight:600;margin-top:6px}
.hero .calc{font-size:14px;color:var(--hero-muted)}
.hero .cta{display:inline-flex;align-items:center;gap:8px;background:#FFFFFF;color:#14161B;text-decoration:none;font-weight:700;padding:14px 20px;border-radius:12px;min-height:48px}
.hero .cta:hover{background:#E8EDFD;color:#14161B}
.hero .foot{display:flex;flex-wrap:wrap;gap:10px 24px;padding-top:16px;border-top:1px solid var(--hero-line);font-size:13px;color:var(--hero-muted)}
.hero .foot strong{color:var(--hero-ink)}
.hero .warnline{color:#FFD08A}

.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px}
.box h2{margin:0;font-size:20px}
.box-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.formula{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;font-family:var(--f-display);font-weight:500;overflow-wrap:anywhere}
.cyc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.cyc{border:1px solid var(--line2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.cyc.last{border-color:var(--alert)}
.cyc .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cyc .top b{font-size:14px}
.cyc .fee{font-family:var(--f-display);font-weight:700;font-size:16px}
.eps{display:flex;flex-wrap:wrap;gap:4px}
.eps i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:block}
.eps em{font-style:normal;font-size:11px;color:var(--muted);line-height:12px}
.cyc .end{font-size:12px;font-weight:600;color:var(--alert)}
.cyc.gap{border-style:dashed;justify-content:center;align-items:center;text-align:center;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:16px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats span{font-size:12px;color:var(--muted)}
.stats .fin{font-family:var(--f-display);font-size:20px}
.sug{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--alert-soft);border-radius:12px;padding:12px 16px}
.sug span{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--alert-ink)}
.sug svg{stroke:var(--alert);flex:none}
.sug button{padding:10px 14px;min-height:44px;border-radius:10px;border:1px solid var(--alert);background:var(--surface);color:var(--alert-btn);font-weight:600;cursor:pointer}
.relax{padding:10px 14px;min-height:44px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600;cursor:pointer}

.offers{display:flex;flex-direction:column;gap:12px}
.offers-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.offers-h h2{margin:0;font-size:20px}
.offers-h select{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:0 10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lp{padding:3px 9px;border-radius:999px;font-size:12px;white-space:nowrap}
.lp.yes{background:var(--ok-soft);color:var(--ok);font-weight:600}
.lp.no{background:var(--bg);color:var(--muted);text-decoration:line-through}
.lp.unknown{padding:2px 8px;border:1px dashed var(--warn-line);color:var(--warn)}
.offer{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:18px;border:1px solid var(--line)}
.offer.best{border:2px solid var(--accent)}
.offer.owned{border:2px solid var(--ok)}
.offer .c1{flex:1 1 220px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.logo-tile{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-weight:700;font-size:18px;font-family:var(--f-display)}
.offer .c1 .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.offer .pf{font-weight:700;font-size:16px}
.offer .pn{font-size:14px;color:var(--muted)}
.badge{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.badge.best{background:#2446D8}.badge.own{background:#1E6B3D}
.offer .c2{flex:2 1 280px;display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:0}
.offer .c3{flex:1 1 190px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.offer .tot{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.go{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;min-height:44px;border-radius:10px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;font-size:14px}
.go:hover{color:var(--bg);opacity:.9}
.stale{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:6px}
.avail{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:6px;align-self:flex-start}
.rep-btn{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;min-height:32px;padding:0}
.report{flex-basis:100%;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.report .opts{display:flex;flex-wrap:wrap;gap:6px}
.report textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
.report .act{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.thanks{font-size:13px;color:var(--ok);font-weight:600}
details.non{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 18px}
details.non summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.non-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.non-row .why{color:var(--alert-btn)}
footer.foot{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:12px;color:var(--muted)}

@media (max-width:860px){
  .method{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .steps{grid-template-columns:minmax(0,1fr)}
  .prefs{max-width:none}
}
@media (max-width:600px){
  :root{--gutter:16px}
  .home-main{padding-block:28px 48px;gap:40px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:22px}
  .box{padding:18px}
  .offer .c3{align-items:flex-start;text-align:left}
  .grid-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .search-box input{font-size:16px}
}

<script>
(function () {
'use strict';
const D = window.CENFLIX_DATA;

/* ================= Stałe i narzędzia ================= */
const SVC = [
  { name: 'Netflix', ini: 'N', color: '#B1060F' },
  { name: 'HBO Max', ini: 'M', color: '#4B2BB5' },
  { name: 'Disney+', ini: 'D', color: '#103A8E' }
];
const QL = ['SD', 'HD', 'Full HD', '4K'];
const DAY = 864e5;
const DATA_DATE = new Date(2026, 9, 28);           // stan danych z importu tabel
const DATA_DATE_TXT = '28.10.2026';
const STALE_DAYS = 30;
const LANG = { audio: 'Lektor lub dubbing PL', subs: 'Napisy PL' };
const PLANS = D.plans;
const G = D.genres;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => s.toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9Ѐ-ӿ぀-ヿ一-鿿가-힯 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function addMonths(d, n) {
  const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n);
  const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x;
}
const pad = (n) => (n < 10 ? '0' + n : '' + n);
const fmt = (d) => pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
const fmtShort = (d) => pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = (s) => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const pln = (n) => n.toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' zł';
function plural(n, one, few, many) {
  if (n === 1) return one;
  const t = n % 10, h = n % 100;
  return (t >= 2 && t <= 4 && (h < 12 || h > 14)) ? few : many;
}
const cykl = (n) => plural(n, 'cykl', 'cykle', 'cykli');
const dni = (n) => plural(n, 'dzień', 'dni', 'dni');
const hours = (min) => { const h = min / 60; return (h < 10 ? h.toFixed(1).replace('.', ',').replace(',0', '') : Math.round(h)) + ' h'; };
const sezony = (n) => n + ' ' + plural(n, 'sezon', 'sezony', 'sezonów');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* tryb prywatny itp. */ } }
};

/* ================= Dane: katalog + cennik ================= */
// Szacowany czas odcinka — w danych źródłowych brak długości odcinków seriali.
function estMin(g, eps, seasons) {
  const has = (k) => g.indexOf(k) >= 0;
  const per = eps / Math.max(1, seasons);
  if (has(4)) return per > 40 ? 12 : 24;           // animacja
  if (has(17)) return 40;                           // talk-show
  if (has(2) && !has(0) && !has(3)) return 28;      // komedia
  if (has(7) || has(1)) return 45;                  // reality / dokument
  return 50;
}
const SERIES = D.series.map((r, i) => {
  const [title, orig, y0, y1, seasons, eps, genres, rating, av] = r;
  return {
    id: i, title, orig, y0, y1, seasons, eps, genres, rating,
    epMin: estMin(genres, eps, seasons),
    av: av.map((a) => ({ svc: a[0], q: a[1], audio: a[2], subs: a[3], leave: a[4] ? parseISO(a[4]) : null, seasons: a[5], eps: a[6], link: D.prefix[a[0]] + a[7] })),
    nt: norm(title), no: norm(orig || '')
  };
});
function seasonSizes(s) {
  const b = Math.floor(s.eps / s.seasons), r = s.eps % s.seasons;
  return Array.from({ length: s.seasons }, (_, i) => b + (i < r ? 1 : 0));
}
function episodesFor(s, scope) {
  const out = [];
  seasonSizes(s).forEach((n, i) => {
    if (scope && scope.indexOf(i + 1) < 0) return;
    for (let e = 1; e <= n; e++) out.push('S' + (i + 1) + 'E' + e);
  });
  return out;
}
function statusOf(s) {
  const y = today0().getFullYear();
  if (s.y1 < y - 1) return { text: 'Zakończony', cls: 'ok', title: 'Ostatnie odcinki: ' + s.y1 };
  return { text: 'Status emisji: brak informacji', cls: 'unk', title: 'Ostatnia emisja w ' + s.y1 + ' — dane nie mówią, czy serial jest kontynuowany' };
}

/* ================= Profile oglądania i harmonogram ================= */
const PROFILES = [
  { id: 'binging', name: 'Binging', unit: () => 'dziennie', def: (s) => Math.max(2, Math.min(20, Math.round(300 / s.epMin))), desc: (r, s) => r + ' odc. dziennie (~' + hours(r * s.epMin) + ')' },
  { id: 'daily', name: 'Daily', unit: () => 'dziennie', def: () => 1, desc: (r) => r + ' odc. dziennie' },
  { id: 'weekend', name: 'Weekendowy', unit: () => 'w weekend', def: () => 4, desc: (r) => r + ' odc. w weekend' },
  { id: 'weekly', name: 'Weekly', unit: () => 'w tygodniu', def: () => 1, desc: (r) => r + ' odc. w tygodniu' },
  { id: 'custom', name: 'Własny', unit: (ev) => 'co ' + ev + ' ' + dni(ev), def: () => 2, desc: (r, s, ev) => r + ' odc. co ' + ev + ' ' + dni(ev) }
];
const PROF = Object.fromEntries(PROFILES.map((p) => [p.id, p]));

function schedule(pid, rate, n, start, every) {
  const out = new Array(n);
  const sat = addDays(start, (6 - start.getDay() + 7) % 7);
  const half = Math.ceil(rate / 2);
  for (let i = 0; i < n; i++) {
    const k = Math.floor(i / rate);
    if (pid === 'weekly') out[i] = addDays(start, k * 7);
    else if (pid === 'weekend') out[i] = addDays(sat, k * 7 + ((i % rate) < half ? 0 : 1));
    else if (pid === 'custom') out[i] = addDays(start, k * every);
    else out[i] = addDays(start, k);
  }
  return out;
}
// Cykle rozliczeniowe od dnia pierwszego odcinka (rocznica wykupienia). Płatne = cykle z min. 1 odcinkiem (BR-078).
function cycles(dates, months) {
  const first = dates[0], last = dates[dates.length - 1];
  const out = []; let j = 0;
  for (let k = 0; k < 3000; k++) {
    const start = addMonths(first, k * months), end = addDays(addMonths(first, (k + 1) * months), -1);
    const from = j; while (j < dates.length && dates[j] <= end) j++;
    out.push({ start, end, from, to: j });
    if (last <= end) break;
  }
  return out;
}
const paid = (cyc) => cyc.filter((c) => c.to > c.from).length;

/* ================= Kalkulacja ofert ================= */
const DEFAULTS = { profile: 'binging', rate: null, every: 3, langs: [], q: 0, noAds: false, owned: {}, scope: null, start: null, sort: 'total' };

function evaluate(s, st) {
  const prof = PROF[st.profile];
  const rate = st.rate == null ? prof.def(s) : st.rate;
  const start = st.start || today0();
  const eps = episodesFor(s, st.scope);
  const sch = schedule(st.profile, rate, eps.length, start, st.every);
  const cM = cycles(sch, 1), cY = cycles(sch, 12);
  const nM = paid(cM), nY = paid(cY);
  const last = sch[sch.length - 1];
  const maxSeason = st.scope ? Math.max.apply(null, st.scope) : s.seasons;
  const offers = [];
  s.av.forEach((a) => PLANS.forEach((p) => {
    if (p.svc !== a.svc) return;
    const reasons = [], notes = [];
    if (a.seasons < maxSeason) reasons.push('tylko sezony 1–' + a.seasons);
    if (st.langs.length && !st.langs.some((k) => a[k])) reasons.push(st.langs.map((k) => 'brak: ' + LANG[k]).join(' / '));
    const effQ = a.q < 0 ? null : Math.min(a.q, p.q);
    if (st.q) {
      if (a.q < 0) reasons.push('jakość serialu na platformie: brak informacji (wymagane ' + QL[st.q] + ')');
      else if (effQ < st.q) reasons.push('maks. ' + QL[effQ] + ' (wymagane ' + QL[st.q] + ')');
    }
    if (st.noAds && p.ads) reasons.push('plan z reklamami');
    if (a.leave) {
      if (a.leave < last) reasons.push('znika z platformy ' + fmt(a.leave) + ', przed końcem planu (' + fmt(last) + ')');
      else if (a.leave - start < 365 * DAY) notes.push('Dostępny do ' + fmt(a.leave));
    }
    const owned = !!st.owned[a.svc];
    const mTotal = nM * p.m;
    const yTotal = p.y != null ? nY * p.y : Infinity;
    const useYear = yTotal < mTotal;
    offers.push({ a, p, reasons, notes, effQ, owned, useYear, mTotal, yTotal, n: useYear ? nY : nM, total: owned ? 0 : Math.min(mTotal, yTotal) });
  }));
  const cmp = {
    total: (x, y) => (x.total - y.total) || (x.p.m - y.p.m),
    monthly: (x, y) => (x.p.m - y.p.m) || (x.total - y.total),
    quality: (x, y) => ((y.effQ == null ? -1 : y.effQ) - (x.effQ == null ? -1 : x.effQ)) || (x.total - y.total)
  };
  const matches = offers.filter((o) => !o.reasons.length);
  const best = matches.slice().sort(cmp.total)[0] || null;
  matches.sort(cmp[st.sort] || cmp.total);
  const non = offers.filter((o) => o.reasons.length);
  return { prof, rate, start, eps, sch, cM, cY, nM, nY, last, best, matches, non, offers };
}

const priceCache = new Map();
function fromPrice(s) {
  if (!priceCache.has(s.id)) {
    const r = evaluate(s, Object.assign({}, DEFAULTS));
    priceCache.set(s.id, r.best ? r.best.total : null);
  }
  return priceCache.get(s.id);
}

/* ================= Stan aplikacji ================= */
const saved = store.get('cenflix-prefs', {});
let st = Object.assign({}, DEFAULTS, {
  langs: Array.isArray(saved.langs) ? saved.langs : [],
  q: saved.q || 0, noAds: !!saved.noAds, owned: saved.owned || {}
});
let current = null;      // serial na stronie wyniku
let reportOpen = null;   // klucz oferty z otwartym formularzem zgłoszenia
let reportDone = {};
const cat = { tab: 'popular', genre: 0, svc: 0, limit: 15 };

function savePrefs() { store.set('cenflix-prefs', { langs: st.langs, q: st.q, noAds: st.noAds, owned: st.owned }); }
function setSt(patch) { st = Object.assign({}, st, patch); savePrefs(); renderSeriesBody(); }

/* ================= Komponenty wspólne ================= */
function posterColor(s) { return 'var(--poster' + ((s.id * 7 + s.title.length) % 5 + 1) + ')'; }
function initials(t) { const w = t.replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean); return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase(); }
function svcDots(s) { return s.av.map((a) => '<span class="dot" style="background:' + SVC[a.svc].color + '" title="' + SVC[a.svc].name + '">' + SVC[a.svc].ini + '</span>').join(''); }
function svcNames(s) { return s.av.map((a) => SVC[a.svc].name).join(', '); }
const ICON_SEARCH = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>';

function searchHTML(id, compact, value) {
  return '<div class="search' + (compact ? ' compact' : '') + '" id="' + id + '">' +
    '<label class="search-box">' + ICON_SEARCH +
    '<span class="sr">Tytuł serialu</span>' +
    '<input id="' + id + '-in" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="' + id + '-list" aria-autocomplete="list" placeholder="' + (compact ? 'Szukaj serialu' : 'Wpisz tytuł (oryginalny lub angielski)') + '" value="' + esc(value || '') + '">' +
    '</label><div class="sugg" id="' + id + '-list" role="listbox" aria-label="Podpowiedzi" hidden></div></div>';
}
function findSeries(q, limit) {
  const n = norm(q); if (!n) return [];
  const words = n.split(' ');
  const res = [];
  for (const s of SERIES) {
    let sc = 0;
    for (const t of [s.nt, s.no]) {
      if (!t) continue;
      if (t === n) sc = Math.max(sc, 100);
      else if (t.startsWith(n)) sc = Math.max(sc, 60);
      else if (words.every((w) => (' ' + t).indexOf(' ' + w) >= 0)) sc = Math.max(sc, 40);
      else if (t.indexOf(n) >= 0) sc = Math.max(sc, 20);
    }
    if (sc) res.push([sc + s.rating / 10 + s.av.length * 2, s]);
  }
  res.sort((a, b) => b[0] - a[0]);
  return res.slice(0, limit).map((r) => r[1]);
}
function wireSearch(id) {
  const root = document.getElementById(id); if (!root) return;
  const input = root.querySelector('input'), list = root.querySelector('.sugg');
  let items = [], sel = -1, timer = 0;
  const close = () => { list.hidden = true; root.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); sel = -1; };
  const paint = () => {
    const q = input.value.trim();
    if (!q) { close(); return; }
    items = findSeries(q, 7);
    if (!items.length) {
      list.innerHTML = '<div class="empty">Nie mamy „' + esc(q) + '” w katalogu Netflix, HBO Max i Disney+ (PL). Sprawdź pisownię albo wpisz tytuł oryginalny.</div>';
    } else {
      list.innerHTML = items.map((s, i) => {
        const p = fromPrice(s);
        return '<a href="#serial-' + s.id + '" role="option" id="' + id + '-o' + i + '" aria-selected="' + (i === sel) + '">' +
          '<span class="mini" style="background:' + posterColor(s) + '"></span>' +
          '<span class="t"><strong>' + esc(s.title) + '</strong><span>' + (s.orig ? esc(s.orig) + ' · ' : '') + s.y0 + ' · ' + sezony(s.seasons) + ' · ' + svcNames(s) + '</span></span>' +
          '<span class="p">' + (p == null ? '—' : 'od ' + pln(p)) + '</span></a>';
      }).join('');
    }
    list.hidden = false; root.classList.add('open'); input.setAttribute('aria-expanded', 'true');
  };
  const mark = () => {
    list.querySelectorAll('[role=option]').forEach((el, i) => el.setAttribute('aria-selected', String(i === sel)));
    if (sel >= 0) input.setAttribute('aria-activedescendant', id + '-o' + sel); else input.removeAttribute('aria-activedescendant');
  };
  input.addEventListener('input', () => { clearTimeout(timer); sel = -1; timer = setTimeout(paint, 90); });
  input.addEventListener('focus', () => { if (input.value.trim()) paint(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) paint(); sel = Math.min(items.length - 1, sel + 1); mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); mark(); }
    else if (e.key === 'Enter') { e.preventDefault(); const t = items[sel >= 0 ? sel : 0]; if (t && !list.hidden) { close(); go(t.id); } }
    else if (e.key === 'Escape') close();
  });
  list.addEventListener('mousedown', (e) => e.preventDefault());
  list.addEventListener('click', () => close());
  input.addEventListener('blur', () => setTimeout(close, 120));
}

      '<span class="big num">' + pln(hero.total) + '</span>' +
      '<span class="pl">' + SVC[hero.a.svc].name + ' · ' + esc(hero.p.name) + '</span>' +
      '<span class="calc">' + calcText(hero) + ' · ' + distinct + ' ' + dni(distinct) + ' oglądania · koniec ' + fmt(R.last) + (hero.total > 0 ? ' · ≈ ' + pln(perH) + ' / h' : '') + '</span></div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px"><a class="cta" href="' + esc(hero.a.link) + '" target="_blank" rel="noopener">Przejdź do ' + SVC[hero.a.svc].name + ' <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></a>' +
      '<span class="xs" style="color:var(--hero-muted)">Link bezpośredni · nie wpływa na ranking</span></div></div>' +
      '<div class="foot">' + (hero.owned ? '<span>Masz już ' + SVC[hero.a.svc].name + ' — nic nie dopłacasz</span>' : '<span>Zrezygnuj z subskrypcji do <strong>' + fmt(lastCycle.end) + '</strong></span>') +
      '<span>Szacunek na podstawie Twojego tempa — ostateczne warunki określa platforma</span><span>Stan danych ' + DATA_DATE_TXT + '</span>' +
      hero.notes.map((n) => '<span class="warnline">' + esc(n) + '</span>').join('') + '</div></section>';
    html += planHTML(s, R, hero, cyc, distinct, unit);
  } else {
    html += noMatchHTML(s, R);
  }
  html += offersHTML(s, R);
  return html;
}

function planHTML(s, R, hero, cyc, distinct, unit) {
  const o = hero, p = o.p;
  const per = o.useYear ? 'cykl roczny' : 'cykl miesięczny';
  const fee = (i) => o.owned ? '0 zł' : (o.useYear ? pln(p.y) : pln(p.m));
  const MAXC = 12;
  const shown = cyc.length > MAXC ? cyc.slice(0, MAXC - 1).concat([null, cyc[cyc.length - 1]]) : cyc;
  const cards = shown.map((c, k) => {
    if (!c) { const hidden = cyc.length - MAXC; return '<div class="cyc gap">… jeszcze ' + hidden + ' ' + cykl(hidden) + ' po ' + fee() + '</div>'; }
    const i = cyc.indexOf(c);
    const cnt = c.to - c.from;
    const capped = Math.min(cnt, 48);
    let eps = '';
    for (let j = c.from; j < c.from + capped; j++) eps += '<i title="' + R.eps[j] + ' · ' + fmt(R.sch[j]) + '"></i>';
    if (cnt > capped) eps += '<em>+' + (cnt - capped) + '</em>';
    const isLast = i === cyc.length - 1;
    return '<div class="cyc' + (isLast ? ' last' : '') + '"><div class="top"><b>Cykl ' + (i + 1) + '</b><span class="fee num">' + fee(i) + '</span></div>' +
      '<span class="xs muted">' + fmtShort(c.start) + ' – ' + fmt(c.end) + '</span>' +
      '<div class="eps" aria-label="' + cnt + ' odcinków">' + eps + '</div>' +
      '<span class="xs muted">' + cnt + ' odc. (' + R.eps[c.from] + '–' + R.eps[c.to - 1] + ')</span>' +
      (isLast ? '<span class="end">Koniec oglądania ' + fmt(R.last) + (o.owned ? '' : ' · zrezygnuj do ' + fmt(c.end)) + '</span>' : '') + '</div>';
  }).join('');
  const formula = o.owned
    ? 'Masz już ' + SVC[o.a.svc].name + ' → koszt dodatkowy 0 zł'
    : R.eps.length + ' odc. × ok. ' + s.epMin + ' min · ' + R.rate + ' odc. ' + unit + ' → ' + distinct + ' ' + dni(distinct) + ' oglądania → ' + o.n + ' ' + cykl(o.n) + ' × ' + (o.useYear ? pln(p.y) + ' (plan roczny)' : pln(p.m)) + ' = ' + pln(o.total);

  // Porównanie okresów rozliczeniowych (BR-034)
  let yearCmp = '';
  if (!o.owned && p.y != null) {
    yearCmp = '<p class="hint" style="font-size:13px">' + (o.useYear
      ? 'Plan roczny (' + pln(o.yTotal) + ') wychodzi taniej niż ' + R.nM + ' ' + cykl(R.nM) + ' miesięcznych (' + pln(o.mTotal) + ').'
      : 'Plan roczny kosztowałby ' + pln(o.yTotal) + ' — przy Twoim tempie miesięczny jest tańszy o ' + pln(o.yTotal - o.mTotal) + '.') + '</p>';
  }

  // Sugestia oszczędności (BR-083)
  let sug = '';
  if (!o.owned && st.profile !== 'binging') {
    const base = o.useYear ? R.nY : R.nM;
    for (let add = 1; add <= 3 && R.rate + add <= 20; add++) {
      const alt = R.rate + add;
      const altN = paid(cycles(schedule(st.profile, alt, R.eps.length, R.start, st.every), o.useYear ? 12 : 1));
      if (altN < base) {
        const save = (base - altN) * (o.useYear ? p.y : p.m);
        sug = '<div class="sug"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"></path></svg>Oglądając ' + alt + ' odc. ' + unit + ' zamiast ' + R.rate + ', zmieścisz się w ' + altN + ' ' + cykl(altN) + ' i zapłacisz ' + pln(save) + ' mniej.</span>' +
          '<button type="button" id="sug" data-act="setrate" data-v="' + alt + '">Zastosuj</button></div>';
        break;
      }
    }
  }
  return '<section class="box" id="plan" aria-label="Plan oglądania"><div class="box-h"><h2>Plan oglądania</h2><span class="small muted">dla: ' + SVC[o.a.svc].name + ' · ' + esc(p.name) + ' · ' + per + ' od dnia wykupienia</span></div>' +
    '<div class="formula num">' + formula + '</div>' +
    '<div class="cyc-grid">' + cards + '</div>' +
    '<div class="stats"><div><span>Pierwszy odcinek</span><strong>' + fmt(R.sch[0]) + '</strong></div><div><span>Ostatni odcinek</span><strong>' + fmt(R.last) + '</strong></div>' +
    '<div><span>Płatne cykle</span><strong>' + o.n + ' ' + cykl(o.n) + '</strong></div><div><span>Cena finalna</span><strong class="fin num">' + pln(o.total) + '</strong></div></div>' +
    yearCmp + sug + '</section>';
}

function noMatchHTML(s, R) {
  const hints = [];
  const tryP = (patch, label, act, v) => {
    const n = evaluate(s, Object.assign({}, st, patch)).matches.length;
    if (n > 0) hints.push('<button type="button" class="relax" data-act="' + act + '" data-v="' + (v || '') + '">' + label + ': ' + n + ' ' + plural(n, 'oferta', 'oferty', 'ofert') + '</button>');
  };
  if (st.langs.length) tryP({ langs: [] }, 'Bez wymagania „' + st.langs.map((k) => LANG[k]).join(' / ') + '”', 'relax-langs');
  if (st.langs.length && st.langs.indexOf('subs') < 0) tryP({ langs: ['subs'] }, 'Zamiast tego Napisy PL', 'relax-subs');
  if (st.q) tryP({ q: 0 }, 'Bez wymagania „min. ' + QL[st.q] + '”', 'relax-q');
  if (st.noAds) tryP({ noAds: false }, 'Dopuść plany z reklamami', 'relax-ads');
  if (st.profile !== 'binging') tryP({ profile: 'binging', rate: null }, 'Oglądaj szybciej (Binging)', 'profile', 'binging');
  return '<section class="box" aria-label="Brak wyników"><h2 style="font-family:var(--f-display);font-size:26px">Żadna oferta nie spełnia wszystkich wymagań</h2>' +
    '<p style="margin:0" class="muted">Serial jest dostępny legalnie (' + svcNames(s) + '), ale nie w tej konfiguracji. ' + (hints.length ? 'Poluzuj jedno z wymagań:' : 'Zmień wymagania w panelu po lewej.') + '</p>' +
    '<div class="chips">' + hints.join('') + '</div></section>';
}

function offersHTML(s, R) {
  const t0 = today0();
  const age = Math.round((t0 - DATA_DATE) / DAY);
  const rows = R.matches.map((o) => {
    const key = o.a.svc + '-' + o.p.name;
    const isBest = R.best === o;
    const pills = Object.keys(LANG).map((k) => '<span class="lp ' + (o.a[k] ? 'yes' : 'no') + '">' + LANG[k] + '</span>').join('');
    const qn = qNote(o);
    let yearNote = '';
    if (!o.owned && o.p.y != null) yearNote = o.useYear ? 'Liczymy plan roczny ' + pln(o.p.y) + ' — taniej niż ' + R.nM + ' × ' + pln(o.p.m) : 'Plan roczny ' + pln(o.p.y) + ' — mniej korzystny przy Twoim tempie';
    const rep = reportOpen === key ? reportHTML(key) : '';
    return '<article class="offer' + (o.owned ? ' owned' : isBest ? ' best' : '') + '">' +
      '<div class="c1"><span class="logo-tile" aria-hidden="true" style="background:' + SVC[o.a.svc].color + '">' + SVC[o.a.svc].ini + '</span><div class="t">' +
      '<span class="pf">' + SVC[o.a.svc].name + '</span><span class="pn">' + esc(o.p.name) + '</span><div class="chips" style="gap:6px">' +
      (isBest ? '<span class="badge best">Najkorzystniejsza dla Ciebie</span>' : '') + (o.owned ? '<span class="badge own">Masz już</span>' : '') + '</div></div></div>' +
      '<div class="c2"><div><span class="muted">Jakość: </span>' + (o.effQ == null ? '<span class="lp unknown">' + effQText(o) + '</span>' : '<strong>' + effQText(o) + '</strong>') + (qn ? '<span class="muted"> — ' + qn + '</span>' : '') + '</div>' +
      '<div class="chips" style="gap:6px">' + pills + '</div>' +
      '<div class="muted">' + (o.p.ads ? 'Z reklamami' : 'Bez reklam') + ' · ' + o.p.screens + ' ' + plural(o.p.screens, 'ekran', 'ekrany', 'ekranów') + ' · ' + pln(o.p.m) + ' / mies.' + (o.p.note && !/rocz/i.test(o.p.note) ? ' · ' + esc(o.p.note) : '') + '</div>' +
      (yearNote ? '<div class="small muted">' + yearNote + '</div>' : '') +
      o.notes.map((n) => '<span class="avail">' + esc(n) + '</span>').join('') + '</div>' +
      '<div class="c3"><span class="tot num">' + pln(o.total) + '</span><span class="small muted">' + calcText(o) + '</span>' +
      '<a class="go" href="' + esc(o.a.link) + '" target="_blank" rel="noopener">Przejdź do platformy</a>' +
      '<span class="xs muted">Stan danych ' + DATA_DATE_TXT + '</span>' +
      (age > STALE_DAYS ? '<span class="stale">Dane sprzed ' + age + ' dni — czekają na weryfikację</span>' : '') +
      (reportDone[key] ? '<span class="thanks">Dziękujemy — zgłoszenie zapisane</span>' : '<button type="button" class="rep-btn" id="rep-' + key + '" data-act="report" data-v="' + key + '" aria-expanded="' + (reportOpen === key) + '">Zgłoś nieaktualne dane</button>') +
      '</div>' + rep + '</article>';
  }).join('');
  const nonRows = R.non.map((o) => '<div class="non-row"><span><strong>' + SVC[o.a.svc].name + ' · ' + esc(o.p.name) + '</strong> <span class="muted">· ' + pln(o.p.m) + ' / mies.</span></span><span class="why">' + esc(o.reasons.join(' · ')) + '</span></div>').join('');
  return '<section class="offers" aria-label="Oferty"><div class="offers-h"><h2>Pasujące oferty (' + R.matches.length + ')</h2>' +
    '<label class="small muted" style="display:flex;align-items:center;gap:8px">Sortuj <select id="sort" data-chg="sort">' +
    [['total', 'Całkowity koszt ↑'], ['monthly', 'Cena miesięczna ↑'], ['quality', 'Jakość ↓']].map((x) => '<option value="' + x[0] + '"' + (st.sort === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></label></div>' +
    '<div class="legend"><span><span class="lp yes">Napisy PL</span> dostępne</span><span><span class="lp no">Lektor lub dubbing PL</span> brak wg katalogu</span><span><span class="lp unknown">do Full HD</span> jakość serialu: brak informacji, pokazujemy limit planu</span></div>' +
    rows +
    (R.non.length ? '<details class="non"' + (R.matches.length ? '' : ' open') + '><summary>Niepasujące oferty (' + R.non.length + ')</summary><div style="display:flex;flex-direction:column;padding-bottom:12px">' + nonRows + '</div></details>' : '') +
    '</section>';
}
function reportHTML(key) {
  const opts = ['Inna cena', 'Serialu już nie ma', 'Inna jakość', 'Inne wersje językowe'];
  return '<form class="report" data-report="' + key + '"><strong class="small">Co się nie zgadza?</strong><div class="opts">' +
    opts.map((t, i) => '<label class="chip sm" style="gap:6px"><input type="checkbox" name="r" value="' + t + '" id="ro-' + key + '-' + i + '"> ' + t + '</label>').join('') +
    '</div><label class="sr" for="rt-' + key + '">Szczegóły</label><textarea id="rt-' + key + '" name="t" placeholder="Np. na stronie platformy plan kosztuje 39,99 zł"></textarea>' +
    '<div class="act"><button type="submit" class="btn pri">Wyślij zgłoszenie</button><button type="button" class="btn" data-act="report-cancel">Anuluj</button></div>' +
    '<span class="hint">W demo zgłoszenie trafia do pamięci tej przeglądarki, nie do redakcji.</span></form>';
}

/* ================= Zdarzenia ================= */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  const s = current;
  switch (act) {
    case 'open': go(+v); break;
    case 'cat-tab': cat.tab = v; cat.limit = 15; renderCatalog(); break;
    case 'cat-genre': cat.genre = +v; cat.limit = 15; renderCatalog(); break;
    case 'cat-svc': cat.svc = +v; cat.limit = 15; renderCatalog(); break;
    case 'cat-more': cat.limit += 15; renderCatalog(); break;
    case 'profile': setSt({ profile: v, rate: null }); break;
    case 'rate': { const R = evaluate(s, st); setSt({ rate: Math.max(1, Math.min(20, R.rate + +v)) }); break; }
    case 'setrate': setSt({ rate: +v }); break;
    case 'every': setSt({ every: Math.max(1, Math.min(14, st.every + +v)) }); break;
    case 'scope-all': setSt({ scope: null }); break;
    case 'scope': {
      const n = +v; let sc = st.scope ? st.scope.slice() : [];
      sc = sc.indexOf(n) >= 0 ? sc.filter((x) => x !== n) : sc.concat(n).sort((a, b) => a - b);
      setSt({ scope: sc.length && sc.length < s.seasons ? sc : null }); break;
    }
    case 'lang': setSt({ langs: st.langs.indexOf(v) >= 0 ? st.langs.filter((x) => x !== v) : st.langs.concat(v) }); break;
    case 'q': setSt({ q: +v }); break;
    case 'reset': reportOpen = null; setSt(Object.assign({}, DEFAULTS, { owned: {} })); break;
    case 'relax-langs': setSt({ langs: [] }); break;
    case 'relax-subs': setSt({ langs: ['subs'] }); break;
    case 'relax-q': setSt({ q: 0 }); break;
    case 'relax-ads': setSt({ noAds: false }); break;
    case 'report': reportOpen = reportOpen === v ? null : v; renderSeriesBody(); { const t = document.getElementById('rt-' + v); if (t) t.focus(); } break;
    case 'report-cancel': reportOpen = null; renderSeriesBody(); break;
  }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  const k = el.dataset.chg, s = current;
  if (k === 'start') { const d = el.value ? parseISO(el.value) : null; setSt({ start: d && d >= today0() ? d : null }); }
  else if (k === 'ads') setSt({ noAds: el.checked });
  else if (k === 'own') { const o = Object.assign({}, st.owned); o[el.dataset.v] = el.checked; setSt({ owned: o }); }
  else if (k === 'sort') setSt({ sort: el.value });
  else if (k === 'scope-from' || k === 'scope-to') {
    let a = +document.getElementById('sc-from').value, b = +document.getElementById('sc-to').value;
    if (a > b) { if (k === 'scope-from') b = a; else a = b; }
    const sc = []; for (let i = a; i <= b; i++) sc.push(i);
    setSt({ scope: sc.length < s.seasons ? sc : null });
  }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-report]'); if (!f) return;
  e.preventDefault();
  const key = f.dataset.report;
  const reasons = Array.from(f.querySelectorAll('input[name=r]:checked')).map((x) => x.value);
  const list = store.get('cenflix-reports', []);
  list.push({ serial: current.title, offer: key, reasons, text: f.querySelector('textarea').value, at: new Date().toISOString() });
  store.set('cenflix-reports', list);
  reportDone[key] = true; reportOpen = null; renderSeriesBody();
});

/* ================= Routing ================= */
document.documentElement.lang = 'pl';
function route() {
  const h = location.hash.replace('#', '');
  const m = /^serial-(\d+)$/.exec(h);
  if (m && SERIES[+m[1]]) { renderSeries(SERIES[+m[1]]); return; }
  if (current || !document.getElementById('katalog')) renderHome(h === 'katalog' || h === 'jak-liczymy' ? h : null);
  else if (h) { const el = document.getElementById(h); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
  else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

// do testów
window.__cenflix = { evaluate, schedule, cycles, paid, SERIES, DEFAULTS };
})();

</script>

</body></html>
